name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Detect site root
        id: root
        run: |
          if [ -f index.html ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          elif [ -f cilie/index.html ]; then
            echo "dir=cilie" >> "$GITHUB_OUTPUT"
          else
            echo "index.html not found" >&2
            exit 1
          fi
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.root.outputs.dir }}
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
